# Every piece of text the site shows, in Greek and in English.
#
# Edit the wording here, then run `make strings`. It checks the file and rebuilds what the site
# reads; `make check` fails if you forget. In development the change shows on the next reload.
#
# Words in {braces} are filled in by the site, like {address} or {operator}. Keep them, and move
# them anywhere in the sentence the language wants them. The two languages must have the same
# keys and the same {braces}: `make strings` says which one is missing where.
#
# What isn't here: the licence lines on the credits page. Ookla's is a condition of its licence
# and has to stay word for word, so those live in web/src/credits.ts.

