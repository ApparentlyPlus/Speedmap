# what each operator's checker looks like today

TELEKOM:
  base: https://www.telekom.gr
  # sets the cookie availability wants
  warm: /eshop/jsp/eligibility.jsp
  availability: /eshop/jsp/ajax/avdslavailabilityAjaxV2.jsp
  headers:
    Accept-Language: el
    X-Requested-With: XMLHttpRequest
  # Ν./Δ. prefixes are theirs, and the street needs its type in brackets
  form:
    telephone: mTelno
    prefecture: mState
    municipality: mPrefecture
    area: mArea
    street: mAddress
    number: mNumber
  constants:
    searchcriteria: address
    ct: res
  prefecture_prefix: "Ν. "
  municipality_prefix: "Δ. "
  # neither yes nor no
  inconclusive: διερεύνηση
  # VDSL starts at 25 because ADSL tops out at 24
  rungs:
    - [200, FTTH]
    - [100, VECT_VDSL]
    - [25, VDSL]
    - [0, ADSL]

VODAFONE:
  base: https://www.vodafone.gr
  warm: /fixed-onboarding?persistState=true
  # TM Forum qualification behind a same-origin proxy, the path goes in the payload too
  qualify: /tmf-api/serviceQualificationManagement/v4/queryServiceQualification
  proxy: /api/proxy-request
  process: CELL
  retail_party: 1-DIUSAOI90
  headers:
    Accept-Language: el
    sec-fetch-mode: cors
    sec-fetch-site: same-origin
  technology:
    ADSL: ADSL
    VDSL_50: VDSL
    VDSL_100: VECT_VDSL
    FTTH_100: FTTH
    FTTH_300: FTTH
    FTTH_500: FTTH
    FTTH_1000: FTTH
  # qualify without naming a service, fixed wireless never says which generation
  bare:
    FWA: FWA

NOVA:
  base: https://nova.gr
  warm: /statheri-tilefonia/programmata/stathero-internet
  streets: /api/address/streets
  eligibility: /api/GetEligibilityInfo
  headers:
    Accept-Language: el
  # an empty preselect gets no offers, and it limits the answer to that rung and its neighbours
  preselect:
    code: 2P_FIBER_100
    title: Fiber 100
    price: "29.0"
  prefecture_prefix: "Ν. "
  municipality_prefix: "Δ. "
  rungs:
    - [1000, FTTH]
    - [200, FTTH]
    - [100, VECT_VDSL]
    - [50, VDSL]
    - [0, ADSL]
