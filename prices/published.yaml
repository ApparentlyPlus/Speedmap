# Tariffs from providers that publish no machine-readable catalogue. Each entry says where
# it was read and when, so a wrong figure is traceable to a page rather than to nobody.
#
# monthly_eur is what the plan costs once any introductory period ends. promo_monthly_eur
# with promo_months is an introductory price open to any new customer.
#
# Discounts that depend on who you are are deliberately absent: first in your building, a
# student, already on their electricity. They are real, but not available to the person
# doing the comparing, and a ranking built on them would be a ranking of nobody's prices.
#
# A fee written as 0 is an assertion that there is none, made because the provider says so.
# A fee left out is unknown, and the ranker refuses to blend it rather than assume zero.

INALAN:
  source: https://inalan.gr/paketa
  observed_on: 2026-09-10
  # Symmetric throughout: they build and sell their own fibre.
  plans:
    - key: INALAN_300
      name: 300Mbps Phone Unlimited
      technology: FTTH
      down_mbps: 300
      up_mbps: 300
      monthly_eur: 28
      setup_eur: 0
      hardware_eur: 0
    - key: INALAN_1G
      name: 1Gbps Phone Unlimited Plus
      technology: FTTH
      down_mbps: 1000
      up_mbps: 1000
      monthly_eur: 34
      setup_eur: 0
      hardware_eur: 0

