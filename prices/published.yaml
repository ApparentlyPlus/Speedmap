# Tariffs from providers that publish no machine-readable catalogue. Each entry says where it
# was read and when, so a wrong figure is traceable to a page rather than to nobody.

INALAN:
  source: https://inalan.gr/paketa
  observed_on: 2026-09-10
  # Symmetric throughout: they build and sell their own fibre.
  plans:
    - key: INALAN_300
      name: 300Mbps Phone Unlimited
