      monthly_eur: 28
      setup_eur: 0
      hardware_eur: 0
    - key: INALAN_1G
      name: 1Gbps Phone Unlimited Plus
      technology: FTTH
      down_mbps: 1000
      up_mbps: 1000
      monthly_eur: 34
      setup_eur: 0
