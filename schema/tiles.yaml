# field names in the tiles, tools/codegen_tiles.py writes both sides from this

version: 1

layers:
  streets:
    description: >
      One feature per street. Painted by best_mbps, filtered by the per-operator fields.
    geometry: line
    fields:
      id:
        type: integer
        nullable: true
        description: street row id, absent below zoom 10 where identical streets get merged
      best_mbps:
        type: number
        nullable: true
        unit: mbps
        description: fastest anyone reaches here, null if nothing's filed
      nprov:
        type: integer
        nullable: true
        description: operators reaching it at all, absent below zoom 10
      # null = doesn't reach, -1 = reaches with no speed filed
      p_telekom: {type: number, nullable: true, unit: mbps, provider: TELEKOM}
      p_vodafone: {type: number, nullable: true, unit: mbps, provider: VODAFONE}
      p_nova: {type: number, nullable: true, unit: mbps, provider: NOVA}
      p_dei: {type: number, nullable: true, unit: mbps, provider: DEI}
      p_inalan: {type: number, nullable: true, unit: mbps, provider: INALAN}
      p_hcn: {type: number, nullable: true, unit: mbps, provider: HCN}
      # wholesale only (Metadosis files services but has no tariff). Drawn, not offered
      p_metadosis: {type: number, nullable: true, unit: mbps, provider: METADOSIS, role: infrastructure}
      p_fibergrid: {type: number, nullable: true, unit: mbps, provider: FIBERGRID, role: infrastructure}
      p_unitedfiber: {type: number, nullable: true, unit: mbps, provider: UNITEDFIBER, role: infrastructure}
      p_fiber2all: {type: number, nullable: true, unit: mbps, provider: FIBER2ALL, role: infrastructure}
      p_netfiber: {type: number, nullable: true, unit: mbps, provider: NETFIBER, role: infrastructure}

  regions:
    description: >
      One feature per municipality, for the low zooms. Painted by fiber share, since 5G
      reaches nearly everywhere and would make it one colour.
    geometry: polygon
    fields:
      id:
        type: integer
        description: municipality row id
      name:
        type: string
      addresses:
        type: integer
        description: filed addresses, the share's denominator
      fiber:
        type: integer
        description: addresses fiber reaches
      fiber_share:
        type: number
        description: 0 to 1, paints the Filed view
      best_mbps:
        type: number
        nullable: true
        unit: mbps
        description: assured speed of the band, capped at what the technology carries
      # one per view, never a filed figure under the measured map
      measured_mbps:
        type: number
        nullable: true
        unit: mbps
        description: fixed line speed tests, null if untested (most of Greece)
      measured_tests:
        type: integer
        nullable: true
        description: tests behind it, drawn as opacity
      mobile_mbps:
        type: number
        nullable: true
        unit: mbps
        description: same for mobile
      mobile_tests:
        type: integer
        nullable: true

  cells:
    description: >
      One square per tested Ookla tile, ~600 m across. Most of the country has none, so an
      empty view is normal.
    geometry: polygon
    fields:
      quadkey:
        type: string
        description: zoom 16 tile key
      family:
        type: string
        description: fixed or mobile, never mixed
      down_mbps:
        type: number
        unit: mbps
      up_mbps:
        type: number
        unit: mbps
      tests:
        type: integer
        description: tests behind the figure, drawn as opacity

# what slim_basemap.py keeps of the planetiler archives. style.test.ts fails if the style reads more
basemap:
  greece.pmtiles:
    landcover: []
    park: []
    water: []
    transportation: [class]
    transportation_name: [name, "name:el"]
    place: [class, name, "name:el"]
  buildings.pmtiles:
    # the height fallback reads the feature id, always kept
    building: [height, num_floors, min_height]
