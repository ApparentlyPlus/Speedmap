# The field names inside a vector tile, written once so neither side can drift.

version: 1

layers:
  streets:
    description: >
      One feature per street, carrying the best each operator reaches on it. Painted by
      best_mbps and filtered by the per-operator fields, which is why both exist: a filter
      over a single best paints a street in one operator's colour while claiming another's.
    geometry: line
    fields:
      id:
        type: integer
        nullable: true
        description: >
          the street row this was built from. Absent below zoom 10, where streets are under a
          pixel wide and features with identical fields are merged into one
      best_mbps:
        type: number
        nullable: true
        unit: mbps
        description: the fastest anyone reaches here; null is not filed, never zero
      nprov:
        type: integer
        nullable: true
        description: >
          how many operators reach this street at all, filed speed or not. Absent below zoom 10
      # Three states: null is an operator that doesn't reach this street, -1 one that reaches
      # it with no speed filed, and a number is the speed.
      p_telekom: {type: number, nullable: true, unit: mbps, provider: TELEKOM}
      p_vodafone: {type: number, nullable: true, unit: mbps, provider: VODAFONE}
      p_nova: {type: number, nullable: true, unit: mbps, provider: NOVA}
      p_dei: {type: number, nullable: true, unit: mbps, provider: DEI}
      p_inalan: {type: number, nullable: true, unit: mbps, provider: INALAN}
      p_hcn: {type: number, nullable: true, unit: mbps, provider: HCN}
      # Operators nobody can buy from directly: wholesale builders, and Metadosis, which
      # files services and publishes no tariff. Drawn, because fiber in the ground decides
      # whether anyone can ever sell a gigabit here. Listed apart, because offering them as
      # a choice of supplier offers something the reader can't take.
      p_metadosis: {type: number, nullable: true, unit: mbps, provider: METADOSIS, role: infrastructure}
      p_fibergrid: {type: number, nullable: true, unit: mbps, provider: FIBERGRID, role: infrastructure}
      p_unitedfiber: {type: number, nullable: true, unit: mbps, provider: UNITEDFIBER, role: infrastructure}
      p_fiber2all: {type: number, nullable: true, unit: mbps, provider: FIBER2ALL, role: infrastructure}
      p_netfiber: {type: number, nullable: true, unit: mbps, provider: NETFIBER, role: infrastructure}

  regions:
    description: >
      One feature per municipality, for the zooms where a street is a fraction of a pixel.
      A map with no basemap and nothing drawn at low zoom is a black rectangle telling the
      reader to zoom in, somewhere, with no clue where — so the country has to have a shape
      before it has streets. Fiber rather than the fastest anything: the fastest anything is
      5G, which reaches nearly every address, and a map of it is one colour.
    geometry: polygon
    fields:
      id:
        type: integer
        description: the municipality row this was built from
      name:
        type: string
      addresses:
        type: integer
        description: filed addresses in it, which is the denominator of the share
      fiber:
        type: integer
        description: how many of them fiber reaches
      fiber_share:
        type: number
        description: nought to one; what the Filed view is painted by
      best_mbps:
        type: number
        nullable: true
        unit: mbps
        description: the band's assured speed, held to what the technology can carry
      # One figure per view, since the choropleth sits under whichever view is on, and a
      # filed claim under a measured map is the one mix this site won't make.
      measured_mbps:
        type: number
        nullable: true
        unit: mbps
        description: fixed-line speed tests here; null is untested, which is most of Greece
      measured_tests:
        type: integer
        nullable: true
        description: how many tests that rests on, drawn as opacity rather than as deletion
      mobile_mbps:
        type: number
        nullable: true
        unit: mbps
        description: the same for mobile, kept apart because the two measure different things
      mobile_tests:
        type: integer
        nullable: true

  cells:
    description: >
      One feature per Ookla tile that has ever been tested, drawn as the square that was
      measured rather than the centroid they publish. About 600 m across, and only a few per
      cent of the country has any at all, so an empty view is the normal case and must never
      be rendered as a failure.
    geometry: polygon
    fields:
      quadkey:
        type: string
        description: the zoom 16 tile key, which is also its identity upstream
      family:
        type: string
        description: fixed or mobile; the two measure differently and never mix
      down_mbps:
        type: number
        unit: mbps
      up_mbps:
        type: number
        unit: mbps
      tests:
        type: integer
        description: measurements behind the figure; drawn as opacity, never as deletion

# The two archives built elsewhere, by planetiler, cut down to what the style reads. Each
# label carried about eighty translations and each building every Overture attribute, all
# fetched and decoded on every zoom in. tools/slim_basemap.py keeps these layers and fields and
# drops the rest. web/src/map/style.test.ts fails if the style reads anything not listed.
basemap:
  greece.pmtiles:
    landcover: []
    park: []
    water: []
    transportation: [class]
    transportation_name: [name, "name:el"]
    place: [class, name, "name:el"]
  buildings.pmtiles:
    # The height fallback reads the feature id, which isn't a field and is always kept
    building: [height, num_floors, min_height]
