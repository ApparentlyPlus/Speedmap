[project]
name = "speedmap"
version = "0.1.0"
description = "Greek broadband aggregator: register ingest, ISP probes, ranking, tiles"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The geo pipeline
pipeline = [
    "shapely>=2.0",
    "duckdb>=1.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.7",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# Flat layout: each worker directory is an importable package, so a systemd unit
# can run `python -m ingest.register` without depending on the working directory.
[tool.setuptools.packages.find]
exclude = ["tests*", "web*", "schema*", "data*", "tiles*", "bin*", ".venv*"]

# Ruff
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # shadowed builtins
    "C4",        # comprehensions
    "DTZ",       # naive datetimes -- every stored timestamp is timestamptz
    "T20",       # no print() in library code
    "SIM",       # simplify
    "PTH",       # pathlib over os.path
    "RUF",
]
ignore = [
    "E501",  # line length is formatter's job
]

[tool.ruff.lint.per-file-ignores]
"ingest/*" = ["T20"]
"tools/*" = ["T20"]
"tests/*" = ["T20"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_explicit = false
enable_error_code = [
    "redundant-expr",
    "possibly-undefined",
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
